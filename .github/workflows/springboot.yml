name: Spring Boot API E2E Tests
on:
  # 支援手動觸發 (最後的保險)
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Backend image tag to test'
        required: false
        default: 'latest'
  # 支援後端連動觸發 (後端 Main 自動觸發 / 後端 PR 貼標籤觸發)
  repository_dispatch:
    types: [backend_image_updated]
  # 支援本 Repo PR 標籤觸發 (測試腳本變更時使用)
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
  # 支援本 Repo push main 觸發 (trunk-based 下小改直接進 main，
  # 不開 PR 就沒有貼標籤的機會，push 是這些 commit 唯一會跑到的 CI)。
  # 後端 image 固定對接 latest —— 見下方 Set Image Tag。
  push:
    branches: [main]

jobs:
  e2e-test:
    # 只有以下四種情況會執行：
    # 1. 後端發送訊號 (repository_dispatch)
    # 2. 手動觸發 (workflow_dispatch)
    # 3. 本 Repo push 到 main
    # 4. 本 PR 被貼上 'e2e-test' 標籤
    #    (PR 沒貼標籤就不跑，避免每次 push 分支都拉一次 Oracle)
    if: |
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-test'))
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set Image Tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # 來自後端的自動/手動標籤觸發，直接拿 payload 裡的 tag
            TAG="${{ github.event.client_payload.image_tag }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            # 本 Repo 自己的變更 (push main / PR 貼標籤)，對接後端的 latest
            TAG="latest"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "🏷️ Using image tag: $TAG"
          echo "### 🚀 Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 原本的 A、B 步驟合併為這一個
      - name: Start Environment and Wait
        env:
          ORACLE_TEST_USERNAME: ${{ secrets.DB_USER }}
          ORACLE_TEST_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: |
          echo "🚀 Starting environment with image tag: $IMAGE_TAG"
          # --wait 會等待 Dockerfile 中的 HEALTHCHECK 成功
          docker compose -f docker-compose.test.yml up -d --wait --quiet-pull
          
          echo "=== Container Status ==="
          docker compose -f docker-compose.test.yml ps
          
          # 檢查 app 是否真的 healthy (確保不是因為超時而強行結束)
          STATUS=$(docker inspect --format='{{json .State.Health.Status}}' spring-boot-app-test)
          echo "App status: $STATUS"
          if [ "$STATUS" != "\"healthy\"" ]; then
            echo "❌ App failed to become healthy. Logs:"
            docker compose -f docker-compose.test.yml logs app
            exit 1
          fi

      # 步驟 C：執行測試 (利用 Playwright 容器跑，或者在本機跑)
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 型別要對準「正在被測的那個 image」，因此 spec 直接從剛啟動的容器抓
      # （/v3/api-docs 在 SecurityConfig 是 permitAll，不需帶認證）。
      #
      # 不能改用版控裡的 docs/swagger.json：那份是上游 SpringBoot repo 推過來的快照，
      # 且上游的推送發生在它 dispatch 本 workflow 之後（同步是另一個 job），
      # 所以自動觸發時它必定落後被測 image 一版；workflow_dispatch 指定舊 image 時更是直接錯配。
      - name: Update API Types from Live Spec
        run: pnpm run api-spec:update

      # 純提示、不阻擋：測試已經用 live spec，這一步只是讓「版控快照落後」這件事看得見。
      #
      # 這裡的差異**幾乎總是預期行為**（完整讀法見 docs/agents/13-advanced-techniques.md）：
      # 上游 image-publish.yml 的 dispatch 是 build-and-push 的最後一步，而同步 docs/swagger.json
      # 的 generate-docs 是 needs: build-and-push，所以快照 commit 必定晚於本 workflow 的 checkout
      # （2026-08-13 實測 63 秒）。上游只要改了 API 契約，這裡就一定出現一次差異。
      # 因此訊息刻意不用 ⚠️ —— 用 ⚠️ 標記一個「每次改 API 都會出現」的東西，只會訓練大家忽略它。
      # 唯一該追的異常：連續多次「上游 push main」觸發都出現**相同**差異 → 上游 generate-docs
      # 沒推成功，去查上游 run。
      - name: Check committed swagger.json against live spec
        env:
          # 上游 dispatch 時把它自己的觸發事件放進 payload（push / pull_request），
          # 用來區分「快照晚 60 秒」與「這個 image 根本不會有快照」兩種情況。
          UPSTREAM_EVENT: ${{ github.event.client_payload.event_name }}
        run: |
          if diff -u <(jq -S . docs/swagger.json) <(jq -S . docs/swagger.live.json) > spec-drift.diff; then
            echo "✅ 版控快照 \`docs/swagger.json\` 與被測 image 的 spec 一致" >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ℹ️ 版控快照與被測 image 的 spec 有差異（預期行為，不影響測試結果）"
              echo ""
              echo "測試型別取自被測 image 的 live spec，本步驟純提示、不阻擋。差異的來源："
              echo ""
              if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] && [ "$UPSTREAM_EVENT" = "push" ]; then
                echo "**上游這次 push 變更了 API 契約。** 上游在 \`build-and-push\` 的最後一步就 dispatch 本 workflow，"
                echo "而同步 \`docs/swagger.json\` 的 \`generate-docs\` 是後續 job，所以本 run checkout 到的必然是上一版"
                echo "快照（實測落後約 60 秒）。快照隨後就會補上，**下次自動觸發即為 ✅**；下方差異就是這次的 API 變更內容。"
                echo ""
                echo "> 只有連續多次自動觸發都出現**相同**差異才算異常 —— 那代表上游 \`generate-docs\` 沒把快照推過來，請查上游 run。"
              elif [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
                echo "**上游是從 PR（而非 push \`main\`）觸發的。** 上游的 \`generate-docs\` 只在 push \`main\` 時執行，"
                echo "因此這個 image 的 spec 不會有對應快照，差異會一直存在到該 PR 合併為止 —— 正常現象。"
              else
                echo "**手動、本 repo push \`main\`、或本 repo PR 貼標籤觸發。** 快照對應上游最新 \`main\`，"
                echo "被測 image 由 image tag 指定 (push \`main\` 固定為 \`latest\`)，"
                echo "兩者沒有版本關聯，差異僅供參考。"
              fi
              echo ""
              echo "<details><summary>差異</summary>"
              echo ""
              echo '```diff'
              head -c 60000 spec-drift.diff
              echo '```'
              echo ""
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run Playwright tests
        run: pnpm playwright test --project=springboot-api
        env:
          # 指向剛啟動的 Docker 容器位址 (通常是 localhost:8787)
          BASE_URL: http://localhost:8787
          # HTTP Basic 認證憑證：與後端容器同一組值，Playwright 據此送出 Authorization 標頭
          API_USERNAME: ${{ secrets.API_USERNAME }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          
      - name: Stop Environment
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # 一併留下實際用來產生型別的 spec 與它跟版控快照的差異，
          # 失敗時才能確認「當時到底是對哪一份 spec 測的」。
          path: |
            playwright-report/
            docs/swagger.live.json
            spec-drift.diff
          retention-days: 30